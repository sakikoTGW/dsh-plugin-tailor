<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Six things dsh-plugin-tailor does">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.6" stop-color="#0D1220"/>
      <stop offset="1" stop-color="#141B33"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#2A3FD0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <text x="48" y="60" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">六个能力，一条流水线</text>
  <text x="48" y="90" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#8FA3C8">审计、规划、风格、品牌、双语、校验；每一步都可以单独用，也可以串起来。</text>

  <g font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(48 122)">
      <rect width="360" height="196" rx="18" fill="#111A33" stroke="#22305C"/>
      <g transform="translate(26 26)">
        <rect width="52" height="52" rx="14" fill="url(#mark)"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="17" y="12" width="18" height="26" rx="4"/>
          <path d="M22 20 H30 M22 27 H28"/>
          <path d="M14 34 L20 40 L34 24"/>
        </g>
      </g>
      <text x="96" y="50" font-size="18" font-weight="700" fill="#FFFFFF">repo_audit</text>
      <text x="96" y="74" font-size="13" fill="#9FB2D4">8 维 34 项检查</text>
      <text x="26" y="122" font-size="13" fill="#6F86B8">身份、首屏、安装、文档、证据、</text>
      <text x="26" y="144" font-size="13" fill="#6F86B8">发布、社区、品牌；缺口带修法。</text>
      <text x="26" y="174" font-size="12" fill="#2FBF71">P0 / P1 / P2 排序</text>
    </g>

    <g transform="translate(420 122)">
      <rect width="360" height="196" rx="18" fill="#111A33" stroke="#22305C"/>
      <g transform="translate(26 26)">
        <rect width="52" height="52" rx="14" fill="url(#mark)"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round">
          <rect x="14" y="12" width="24" height="8" rx="2"/>
          <rect x="17" y="22" width="24" height="8" rx="2" opacity="0.75"/>
          <rect x="20" y="32" width="24" height="8" rx="2" opacity="0.5"/>
        </g>
      </g>
      <text x="96" y="50" font-size="18" font-weight="700" fill="#FFFFFF">repo_readme</text>
      <text x="96" y="74" font-size="13" fill="#9FB2D4">7 种风格 · 双语草稿</text>
      <text x="26" y="122" font-size="13" fill="#6F86B8">evidence / terminal / mobile /</text>
      <text x="26" y="144" font-size="13" fill="#6F86B8">playful / product / platform / minimal。</text>
      <text x="26" y="174" font-size="12" fill="#2FBF71">dry-run 先看 diff</text>
    </g>

    <g transform="translate(792 122)">
      <rect width="360" height="196" rx="18" fill="#111A33" stroke="#22305C"/>
      <g transform="translate(26 26)">
        <rect width="52" height="52" rx="14" fill="url(#mark)"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M26 10 L38 18 V30 L26 38 L14 30 V18 Z"/>
          <circle cx="26" cy="24" r="4"/>
          <path d="M26 28 V34"/>
        </g>
      </g>
      <text x="96" y="50" font-size="18" font-weight="700" fill="#FFFFFF">repo_brand</text>
      <text x="96" y="74" font-size="13" fill="#9FB2D4">12 概念 · 明暗两套</text>
      <text x="26" y="122" font-size="13" fill="#6F86B8">icon、明暗 logo、明暗 banner、</text>
      <text x="26" y="144" font-size="13" fill="#6F86B8">social、brand-sheet，确定性 SVG。</text>
      <text x="26" y="174" font-size="12" fill="#2FBF71">同一输入字节一致</text>
    </g>

    <g transform="translate(48 344)">
      <rect width="360" height="196" rx="18" fill="#111A33" stroke="#22305C"/>
      <g transform="translate(26 26)">
        <rect width="52" height="52" rx="14" fill="url(#mark)"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round">
          <circle cx="26" cy="26" r="14"/>
          <path d="M12 26 H40 M26 12 C34 20 34 32 26 40 C18 32 18 20 26 12 Z"/>
        </g>
      </g>
      <text x="96" y="50" font-size="18" font-weight="700" fill="#FFFFFF">双语对等</text>
      <text x="96" y="74" font-size="13" fill="#9FB2D4">README.md + README.en.md</text>
      <text x="26" y="122" font-size="13" fill="#6F86B8">同样章节、同样数字、互相链接；</text>
      <text x="26" y="144" font-size="13" fill="#6F86B8">不是机翻，是结构对等。</text>
      <text x="26" y="174" font-size="12" fill="#2FBF71">语言切换行自动生成</text>
    </g>

    <g transform="translate(420 344)">
      <rect width="360" height="196" rx="18" fill="#111A33" stroke="#22305C"/>
      <g transform="translate(26 26)">
        <rect width="52" height="52" rx="14" fill="url(#mark)"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M26 10 L38 15 V26 C38 34 32 39 26 42 C20 39 14 34 14 26 V15 Z"/>
          <path d="M20 25 L24 30 L33 20"/>
        </g>
      </g>
      <text x="96" y="50" font-size="18" font-weight="700" fill="#FFFFFF">写保护</text>
      <text x="96" y="74" font-size="13" fill="#9FB2D4">dry-run / apply / force</text>
      <text x="26" y="122" font-size="13" fill="#6F86B8">手写 README、已有素材、脏工作树</text>
      <text x="26" y="144" font-size="13" fill="#6F86B8">默认拒绝，必须显式 force。</text>
      <text x="26" y="174" font-size="12" fill="#2FBF71">路径不越出仓库根目录</text>
    </g>

    <g transform="translate(792 344)">
      <rect width="360" height="196" rx="18" fill="#111A33" stroke="#22305C"/>
      <g transform="translate(26 26)">
        <rect width="52" height="52" rx="14" fill="url(#mark)"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="26" cy="26" r="15"/>
          <path d="M18 26 L24 32 L34 20"/>
        </g>
      </g>
      <text x="96" y="50" font-size="18" font-weight="700" fill="#FFFFFF">repo_verify</text>
      <text x="96" y="74" font-size="13" fill="#9FB2D4">发布前最后一道闸</text>
      <text x="26" y="122" font-size="13" fill="#6F86B8">相对链接、图片、锚点、徽章、</text>
      <text x="26" y="144" font-size="13" fill="#6F86B8">必需章节、剩余 TODO、分数差。</text>
      <text x="26" y="174" font-size="12" fill="#2FBF71">PASS / FAIL + 逐项输出</text>
    </g>
  </g>
</svg>
