  <text x="48" y="62" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">7 种 README 风格，你选</text>
  <text x="48" y="94" font-family="Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#8FA3C8">预设决定 layout + tone；内容仍来自仓库事实。默认 dry-run，先看 diff 再落盘。</text>

